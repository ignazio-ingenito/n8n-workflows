name: Validate workflows

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate workflow JSON
        env:
          VALIDATE_CREDENTIALS: "0"
        run: ./scripts/validate-workflows.sh
