name: Validate workflow JSON

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate JSON syntax
        run: find workflows -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty
