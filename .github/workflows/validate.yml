name: Validate workflows

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate workflow JSON
        run: ./scripts/validate-workflows.sh
      - name: Test GitHub dependency automerge policy
        run: node ./scripts/test-github-dependency-automerge.js
